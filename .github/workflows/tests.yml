name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  matrix:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '10'
            php: '8.1'
            testbench: '^8.0'
          - laravel: '11'
            php: '8.2'
            testbench: '^9.0'
          - laravel: '12'
            php: '8.2'
            testbench: '^10.0'
          - laravel: '13'
            php: '8.3'
            testbench: '^11.0'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: helpers_test
          MYSQL_USER: helpers
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhelpers -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: helpers_test
      DB_USERNAME: helpers
      DB_PASSWORD: secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring, pcntl, pdo_mysql, pdo_sqlite, redis
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.laravel }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update orchestra/testbench --with-all-dependencies --no-interaction --prefer-dist

      - name: Verify Laravel version
        run: composer show illuminate/support | grep "versions.*v${{ matrix.laravel }}\\."

      - name: Run full behavioral suite
        run: vendor/bin/phpunit -c phpunit.ci.xml --testsuite HalaeiHelpers,Characterization

      - name: Public API contract
        run: vendor/bin/phpunit -c phpunit.ci.xml --testsuite Contract

      - name: Comprehensive validation
        run: vendor/bin/phpunit -c phpunit.ci.xml --testsuite Validation

  coverage:
    name: Coverage (100% gate)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: helpers_test
          MYSQL_USER: helpers
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhelpers -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: helpers_test
      DB_USERNAME: helpers
      DB_PASSWORD: secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, json, mbstring, pcntl, pdo_mysql, pdo_sqlite, redis
          coverage: pcov

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer require --dev "orchestra/testbench:^11.0" --no-interaction --no-update
          composer update orchestra/testbench --with-all-dependencies --no-interaction --prefer-dist

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if php -r "
              try {
                  new PDO(
                      'mysql:host=127.0.0.1;port=3306;dbname=helpers_test',
                      'helpers',
                      'secret'
                  );
                  exit(0);
              } catch (Throwable \$e) {
                  exit(1);
              }
            "; then
              echo "MySQL is ready."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time."
          exit 1

      - name: Coverage gate
        run: bash scripts/check-coverage.sh
